name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be started by hand against any ref. Without it, a PR whose
  # checks never got created — a branch name reused after its previous PR was
  # merged and the branch auto-deleted will do it, the check suite latches
  # onto the stale run — can only be unstuck by pushing another commit, since
  # the required checks are "expected" rather than failing and there is
  # nothing to re-run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-server:
    name: Server Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check server
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Run server tests
        run: npm run test -w server

      # Applies the KV migrations against Miniflare's local KV: no credentials,
      # no network, nothing touched on the account. It says nothing about the
      # state of the production namespace — that is the deploy's job — but it
      # does catch the failure that would otherwise only surface halfway
      # through a deploy: a migration file that throws, or one the runner
      # cannot load at all.
      - name: Apply KV migrations (local)
        run: npm run kv:migrate -w server

      - name: Build server
        run: npm run build:server

  test-client:
    name: Client Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The build script is `tsc && vite build`, and client/tsconfig.json has
      # noEmit, so this is the type check as well as the build.
      - name: Type check and build client
        run: npm run build:client

      - name: Run client tests
        run: npm run test -w client

  # The builds run in the test jobs above, which already have the dependencies
  # installed; this job used to reinstall them on a third runner pod after both
  # test jobs had finished. It stays because "Build" is a required status check
  # on main, and it only runs once both test jobs (builds included) passed.
  build:
    name: Build
    runs-on: self-hosted
    needs: [test-server, test-client]
    steps:
      - run: echo "Client and server built in their test jobs."
